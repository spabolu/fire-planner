name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: planner_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: PostgreSQL migration and persistence
        run: npm run db:migrate && node scripts/test-database.mjs
        env:
          DATABASE_URL: postgresql://planner:ci-only-password@127.0.0.1:5432/planner_test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run package:azure
      - run: tar -czf .artifacts/azure-app.tar.gz -C .artifacts/deploy .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: azure-app
          path: .artifacts/azure-app.tar.gz
          retention-days: 3

  deploy:
    name: Deploy to Azure
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: azure-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: azure-app
          path: artifact
      - run: mkdir deploy && tar -xzf artifact/azure-app.tar.gz -C deploy
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: deploy
      - name: Check health and authentication boundary
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail --retry 8 --retry-delay 10 --retry-all-errors "$APP_URL/api/health"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$APP_URL/")
          case "$status" in
            302|401|403) echo "Anonymous financial access is blocked." ;;
            *) echo "Unexpected anonymous page status: $status"; exit 1 ;;
          esac
